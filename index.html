<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style> body { font-family: 'Kanit', sans-serif; } </style>
</head>
<body class="bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl p-6 sm:p-8 w-full max-w-md">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl mb-3 shadow-inner">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
      </div>
      <h1 class="text-2xl font-bold text-gray-800">คำนวณและบันทึกค่า BMI</h1>
      <p class="text-sm text-gray-500 mt-1">ประเมินดัชนีมวลกายและบันทึกข้อมูลสุขภาพ</p>
    </div>

    <form id="bmiForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อ-นามสกุล</label>
        <input type="text" id="name" required placeholder="เช่น สมชาย ใจดี" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">เพศ</label>
          <select id="gender" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
            <option value="ชาย">ชาย</option>
            <option value="หญิง">หญิง</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">อายุ (ปี)</label>
          <input type="number" id="age" required min="1" max="120" placeholder="25" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">น้ำหนัก (kg)</label>
          <input type="number" id="weight" step="0.1" required placeholder="65.5" oninput="calculateBMI()" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">ส่วนสูง (cm)</label>
          <input type="number" id="height" step="0.1" required placeholder="170" oninput="calculateBMI()" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
      </div>

      <div id="resultCard" class="hidden p-4 rounded-2xl bg-gray-50 border border-gray-100 text-center">
        <div class="text-xs text-gray-500 mb-1">ค่า BMI ของคุณ</div>
        <div id="bmiValue" class="text-4xl font-extrabold text-indigo-600">0.0</div>
        <div id="bmiCategory" class="inline-block px-3 py-1 mt-2 text-sm font-medium rounded-full bg-gray-200 text-gray-700">-</div>
      </div>

      <button type="submit" id="submitBtn" class="w-full py-3.5 px-4 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-medium rounded-xl shadow-lg hover:opacity-95 transition flex items-center justify-center space-x-2">
        <span>บันทึกข้อมูลลง Google Sheets</span>
      </button>
    </form>

    <div id="alertBox" class="hidden mt-4 p-3 rounded-xl text-center text-sm font-medium"></div>
  </div>

  <script>
    // ⚠️ วาง Web App URL ที่ก๊อปปี้มาจาก Step 1 ในบรรทัดนี้
    const WEB_APP_URL = "วาง_WEB_APP_URL_ตรงนี้";

    let currentBMI = 0;
    let currentCategory = "";

    function calculateBMI() {
      const weight = parseFloat(document.getElementById('weight').value);
      const height = parseFloat(document.getElementById('height').value);
      const resultCard = document.getElementById('resultCard');

      if (weight > 0 && height > 0) {
        const heightM = height / 100;
        currentBMI = (weight / (heightM * heightM)).toFixed(1);
        
        let colorClass = "";
        if (currentBMI < 18.5) { currentCategory = "น้ำหนักน้อย / ผอม"; colorClass = "bg-blue-100 text-blue-700"; }
        else if (currentBMI <= 22.9) { currentCategory = "ปกติ / สมส่วน"; colorClass = "bg-green-100 text-green-700"; }
        else if (currentBMI <= 24.9) { currentCategory = "ท้วม / น้ำหนักเกิน"; colorClass = "bg-yellow-100 text-yellow-700"; }
        else if (currentBMI <= 29.9) { currentCategory = "อ้วน / อ้วนระดับ 1"; colorClass = "bg-orange-100 text-orange-700"; }
        else { currentCategory = "อ้วนมาก / อ้วนระดับ 2"; colorClass = "bg-red-100 text-red-700"; }

        document.getElementById('bmiValue').innerText = currentBMI;
        const catElem = document.getElementById('bmiCategory');
        catElem.innerText = currentCategory;
        catElem.className = `inline-block px-3 py-1 mt-2 text-sm font-medium rounded-full ${colorClass}`;
        resultCard.classList.remove('hidden');
      } else {
        resultCard.classList.add('hidden');
      }
    }

    function handleFormSubmit(event) {
      event.preventDefault();
      if (!currentBMI || currentBMI == 0) return alert("กรุณากรอกข้อมูลให้ถูกต้อง");

      const btn = document.getElementById('submitBtn');
      const alertBox = document.getElementById('alertBox');
      
      btn.disabled = true;
      btn.innerText = "กำลังบันทึก...";

      const payload = {
        name: document.getElementById('name').value,
        gender: document.getElementById('gender').value,
        age: document.getElementById('age').value,
        weight: document.getElementById('weight').value,
        height: document.getElementById('height').value,
        bmi: currentBMI,
        category: currentCategory
      };

      fetch(WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        btn.disabled = false;
        btn.innerText = "บันทึกข้อมูลลง Google Sheets";
        if (data.success) {
          alertBox.className = "mt-4 p-3 rounded-xl text-center text-sm font-medium bg-green-100 text-green-700 block";
          alertBox.innerText = "บันทึกข้อมูลเรียบร้อยแล้ว!";
          document.getElementById('bmiForm').reset();
          document.getElementById('resultCard').classList.add('hidden');
          setTimeout(() => alertBox.classList.add('hidden'), 4000);
        } else {
          throw new Error(data.error);
        }
      })
      .catch(err => {
        btn.disabled = false;
        btn.innerText = "บันทึกข้อมูลลง Google Sheets";
        alertBox.className = "mt-4 p-3 rounded-xl text-center text-sm font-medium bg-red-100 text-red-700 block";
        alertBox.innerText = "เกิดข้อผิดพลาดในการบันทึก";
      });
    }
  </script>
</body>
</html>
